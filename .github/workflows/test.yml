name: Cold-start test APK

on:
  push:
    branches: ['feat/cold-start']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Test and build release-mode test APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/test.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -PversionName=1.3.4-cold-start-test2 --console=plain
          cp app/build/outputs/apk/release/app-release.apk FuckBiliAds-1.3.4-cold-start-test2.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            FuckBiliAds-1.3.4-cold-start-test2.apk
          sha256sum FuckBiliAds-1.3.4-cold-start-test2.apk >> "$GITHUB_STEP_SUMMARY"
          printf '\n测试包使用临时 debug 钥匙签名，运行 release 模式。每次运行生成独立签名，适合备份后的测试环境换装。\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: FuckBiliAds-cold-start-test
          path: FuckBiliAds-1.3.4-cold-start-test2.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
